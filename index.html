<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBase - Watch Movies & TV Shows</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #141414;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --accent-red: #E50914;
            --accent-red-hover: #f40612;
            --text-main: #FFFFFF;
            --text-muted: #AAAAAA;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-red);
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            transition: background 0.3s ease;
        }
        .navbar.scrolled {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-red);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        .nav-links a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
            font-weight: 700;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px 8px 38px;
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
            width: 220px;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            width: 300px;
            border-color: var(--accent-red);
            background: rgba(0,0,0,0.9);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 80vh;
            min-height: 550px;
            display: flex;
            align-items: center;
            padding: 0 4%;
            background-size: cover;
            background-position: center top;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, var(--bg-dark) 0%, rgba(20,20,20,0.4) 50%, rgba(20,20,20,0.8) 100%),
                        linear-gradient(90deg, var(--bg-dark) 0%, rgba(20,20,20,0.6) 40%, rgba(20,20,20,0) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
            margin-top: 60px;
        }
        .hero-badge {
            display: inline-block;
            background: var(--accent-red);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .hero-overview {
            font-size: 1rem;
            color: #d2d2d2;
            line-height: 1.5;
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .hero-btns {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary {
            background-color: var(--accent-red);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--accent-red-hover);
            transform: scale(1.03);
        }
        .btn-secondary {
            background-color: rgba(109, 109, 110, 0.7);
            color: white;
        }
        .btn-secondary:hover {
            background-color: rgba(109, 109, 110, 0.4);
            transform: scale(1.03);
        }

        /* Media Rows */
        .main-container {
            position: relative;
            z-index: 5;
            margin-top: -60px;
            padding-bottom: 60px;
        }
        .section-row {
            margin-bottom: 40px;
            padding: 0 4%;
        }
        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .row-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e5e5e5;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        .media-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 2/3;
        }
        .media-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .media-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-card-info {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .media-card:hover .media-card-info {
            opacity: 1;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .badge-rating {
            color: #46d369;
            font-weight: 700;
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: var(--bg-card);
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
            transform: translateY(30px);
            transition: transform 0.3s ease;
        }
        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 1.1rem;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: var(--accent-red);
        }

        .modal-header {
            position: relative;
            height: 380px;
            background-size: cover;
            background-position: center;
        }
        .modal-header-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, var(--bg-card) 0%, rgba(24,24,24,0.3) 60%, rgba(0,0,0,0.6) 100%);
        }
        .modal-header-info {
            position: absolute;
            bottom: 24px;
            left: 32px;
            right: 32px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
        }
        .modal-poster {
            width: 110px;
            aspect-ratio: 2/3;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-body {
            padding: 32px;
        }
        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .modal-meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .modal-synopsis {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 24px;
        }

        /* Selector Controls for TV Shows */
        .controls-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 140px;
        }
        .control-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }
        .custom-select {
            background: #222;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Player Section */
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Downloads & Quality Section */
        .section-subtitle {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .download-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            text-decoration: none;
            transition: all 0.2s;
        }
        .download-btn:hover {
            background: var(--accent-red);
            border-color: var(--accent-red);
            transform: translateY(-2px);
        }
        .quality-badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Spinner / Loader */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--accent-red);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-red);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 2rem; }
            .nav-links { display: none; }
            .search-input { width: 140px; }
            .search-input:focus { width: 180px; }
            .modal-header { height: 260px; }
            .modal-poster { display: none; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <a href="#" class="brand-logo" onclick="loadHomePage()">
            <i class="fa-solid fa-play-circle"></i> CineBase
        </a>
        <ul class="nav-links">
            <li><a href="#" class="active" onclick="loadHomePage()">Home</a></li>
            <li><a href="#" onclick="fetchCategory('trending', 'Trending Now')">Trending</a></li>
            <li><a href="#" onclick="fetchCategory('action', 'Action Blockbusters')">Action</a></li>
            <li><a href="#" onclick="fetchCategory('anime', 'Anime Series')">Anime</a></li>
            <li><a href="#" onclick="fetchCategory('korean drama', 'K-Drama Highlights')">K-Drama</a></li>
        </ul>
        <form class="search-box" id="searchForm">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search movies, TV..." autocomplete="off">
        </form>
    </nav>

    <!-- Hero Featured Section -->
    <section class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content" id="heroContent">
            <div class="spinner"></div>
        </div>
    </section>

    <!-- Main Dynamic Content Container -->
    <div class="main-container" id="mainContainer">
        <!-- Rows dynamically injected here -->
    </div>

    <!-- Media Description & Video Player Modal -->
    <div class="modal" id="mediaModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalInner">
                <!-- Modal details dynamically loaded -->
            </div>
        </div>
    </div>

    <script>
        // API CONFIGURATION
        const API_KEY = 'cb_live_5b8529460e4da2229349ddd7d3ae8da527aaa81cdc11f8fa';
        
        // SAFE ARRAY EXTRACTOR (Handles non-standard JSON responses)
        function extractArray(data) {
            if (Array.isArray(data)) return data;
            if (!data) return [];
            const keys = ['results', 'items', 'list', 'data', 'catalog'];
            for (let k of keys) {
                if (Array.isArray(data[k])) return data[k];
            }
            return [];
        }

        // Generic API Fetch Helper (Prevents 405 CORS preflight blocks by avoiding custom headers)
        async function apiFetch(endpoint) {
            try {
                const response = await fetch(endpoint, { method: 'GET' });
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`Fetch error on ${endpoint}:`, error);
                return null;
            }
        }

        // Navbar scroll effect listener
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // Initialize Home Page
        async function loadHomePage() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

            // 1. Fetch Featured / Trending Data
            const trendingRaw = await apiFetch('/api/trending?limit=24');
            const trendingItems = extractArray(trendingRaw);

            if (trendingItems.length > 0) {
                renderHero(trendingItems[0]);
            }

            container.innerHTML = ''; // Clear loader

            // Render Rows
            await renderRow('Trending Now', trendingItems);
            
            // Fetch Action
            const actionRaw = await apiFetch('/api/search?q=action&limit=12');
            renderRow('Action & Adventure', extractArray(actionRaw));

            // Fetch Anime
            const animeRaw = await apiFetch('/api/search?q=anime&limit=12');
            renderRow('Anime Collection', extractArray(animeRaw));

            // Fetch K-Drama
            const kdramaRaw = await apiFetch('/api/search?q=korean%20drama&limit=12');
            renderRow('K-Drama Specials', extractArray(kdramaRaw));
        }

        // Render Hero Banner
        function renderHero(item) {
            const hero = document.getElementById('heroBanner');
            const content = document.getElementById('heroContent');
            const itemPath = item.detailPath || item.id || '';
            const bgImage = item.backdrop || item.poster || item.image || 'https://via.placeholder.com/1200x800';

            hero.style.backgroundImage = `url('${bgImage}')`;
            content.innerHTML = `
                <span class="hero-badge">Featured</span>
                <h1 class="hero-title">${item.title || item.name || 'Untitled'}</h1>
                <p class="hero-overview">${item.overview || item.synopsis || 'Explore details, watch streams in high definition, or download high-quality media sources directly.'}</p>
                <div class="hero-btns">
                    <button class="btn btn-primary" onclick="openMediaModal('${itemPath}')">
                        <i class="fa-solid fa-play"></i> Stream Now
                    </button>
                    <button class="btn btn-secondary" onclick="openMediaModal('${itemPath}')">
                        <i class="fa-solid fa-circle-info"></i> More Info
                    </button>
                </div>
            `;
        }

        // Render Category Grid/Row
        function renderRow(title, items) {
            if (!items || items.length === 0) return;

            const container = document.getElementById('mainContainer');
            const rowSection = document.createElement('div');
            rowSection.className = 'section-row';

            let gridHTML = `<div class="row-header"><h2 class="row-title">${title}</h2></div>`;
            gridHTML += `<div class="media-grid">`;

            items.forEach(item => {
                const itemPath = item.detailPath || item.id || '';
                const titleText = item.title || item.name || 'Untitled';
                const poster = item.poster || item.image || item.backdrop || 'https://via.placeholder.com/300x450?text=No+Poster';
                const rating = item.vote_average || item.rating || '8.5';
                const year = item.year || item.release_date?.substring(0,4) || '2024';

                gridHTML += `
                    <div class="media-card" onclick="openMediaModal('${itemPath}')">
                        <img src="${poster}" alt="${titleText}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                        <div class="media-card-info">
                            <div class="card-title">${titleText}</div>
                            <div class="card-meta">
                                <span class="badge-rating"><i class="fa-solid fa-star"></i> ${rating}</span>
                                <span>${year}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            gridHTML += `</div>`;
            rowSection.innerHTML = gridHTML;
            container.appendChild(rowSection);
        }

        // Search Form Submission Handler
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop form submission & POST reloads
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            fetchCategory(query, `Search Results for "${query}"`);
        });

        async function fetchCategory(query, displayTitle) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
            window.scrollTo({ top: 400, behavior: 'smooth' });

            const dataRaw = await apiFetch(`/api/search?q=${encodeURIComponent(query)}&limit=24`);
            const items = extractArray(dataRaw);

            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 60px; color:#888;">No results found for "${query}".</div>`;
            } else {
                renderRow(displayTitle, items);
            }
        }

        // OPEN MEDIA MODAL (Description + Stream + Downloads)
        async function openMediaModal(detailPath) {
            const modal = document.getElementById('mediaModal');
            const inner = document.getElementById('modalInner');
            
            modal.classList.add('active');
            inner.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

            // 1. Fetch Metadata Details
            const details = await apiFetch(`/api/details?id=${encodeURIComponent(detailPath)}`) || {};
            
            const title = details.title || details.name || 'Title Unavailable';
            const overview = details.overview || details.synopsis || 'No description available for this title.';
            const backdrop = details.backdrop || details.image || details.poster || 'https://via.placeholder.com/900x400';
            const poster = details.poster || details.image || 'https://via.placeholder.com/200x300';
            const rating = details.vote_average || details.rating || 'N/A';
            const year = details.year || details.release_date || '2024';

            // Modal Shell Layout
            inner.innerHTML = `
                <div class="modal-header" style="background-image: url('${backdrop}');">
                    <div class="modal-header-overlay"></div>
                    <div class="modal-header-info">
                        <img src="${poster}" class="modal-poster" alt="Poster">
                        <div>
                            <h2 class="modal-title">${title}</h2>
                            <div class="modal-meta-row">
                                <span class="badge-rating"><i class="fa-solid fa-star"></i> ${rating}</span>
                                <span>${year}</span>
                                <span>CineBase Stream</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-body">
                    <p class="modal-synopsis">${overview}</p>

                    <!-- TV Episode Control Placeholder (if TV) -->
                    <div id="tvMatrixControls"></div>

                    <!-- Stream Video Player Wrapper -->
                    <div class="player-wrapper">
                        <video id="videoPlayer" controls crossorigin="anonymous" poster="${backdrop}">
                            Your browser does not support HTML5 Video playback.
                        </video>
                    </div>

                    <!-- Controls for Subtitles & Streams -->
                    <div class="controls-row">
                        <div class="control-group">
                            <label><i class="fa-solid fa-closed-captioning"></i> Subtitles</label>
                            <select id="subtitleSelect" class="custom-select" onchange="applySubtitle(this.value)">
                                <option value="">Subtitles Off</option>
                            </select>
                        </div>
                    </div>

                    <!-- Download Options -->
                    <div class="section-subtitle"><i class="fa-solid fa-download"></i> Download Qualities</div>
                    <div class="download-grid" id="downloadGrid">
                        <div class="spinner"></div>
                    </div>
                </div>
            `;

            // 2. Fetch Streams (Handles TV vs Movie Auto-Retry Mechanism)
            loadStreamsAndSubtitles(detailPath, 1, 1);
        }

        // Fetch Stream Sources & Subtitles with Auto-Retry Logic
        async function loadStreamsAndSubtitles(detailPath, season = 1, episode = 1) {
            const downloadGrid = document.getElementById('downloadGrid');
            const player = document.getElementById('videoPlayer');
            downloadGrid.innerHTML = `<div class="spinner"></div>`;

            let streamData = null;
            let isTv = false;

            // Try fetching as Movie endpoint first
            let movieRes = await apiFetch(`/api/movie?id=${encodeURIComponent(detailPath)}`);

            // Check if error specifies TV requirement (Auto-Retry Mechanism)
            if (movieRes && movieRes.error && movieRes.error.includes('This subject is a tv')) {
                isTv = true;
                streamData = await apiFetch(`/api/tv?id=${encodeURIComponent(detailPath)}&season=${season}&episode=${episode}`);
            } else {
                streamData = movieRes;
            }

            // Render TV Season/Episode matrices if TV Show
            if (isTv) {
                renderTvControls(detailPath, season, episode);
            }

            // Parse Stream Sources & Downloads
            const streams = extractArray(streamData?.sources || streamData?.qualities || streamData);
            
            downloadGrid.innerHTML = '';

            if (streams.length === 0 && !streamData?.url) {
                downloadGrid.innerHTML = `<p style="color:#aaa; font-size:0.85rem;">No direct media streams found for this selection.</p>`;
            } else {
                // If streamData is a single object with a URL
                const sourcesList = streams.length > 0 ? streams : [{ quality: '1080p Standard', url: streamData.url }];

                // Set Primary Stream to Player via Proxy Endpoint
                const primaryUrl = sourcesList[0].url || sourcesList[0].file || streamData?.url;
                if (primaryUrl) {
                    const proxiedStreamUrl = `/proxy-api/stream?url=${encodeURIComponent(primaryUrl)}&apikey=${API_KEY}`;
                    player.src = proxiedStreamUrl;
                }

                // Populate Multi-Quality Download Buttons
                sourcesList.forEach((srcObj, idx) => {
                    const rawUrl = srcObj.url || srcObj.file || srcObj;
                    const qualityName = srcObj.quality || srcObj.label || `Quality ${idx + 1} (1080p/720p)`;
                    const downloadProxyUrl = `/proxy-api/dl?url=${encodeURIComponent(rawUrl)}&name=${encodeURIComponent('CineBase-Media.mp4')}&apikey=${API_KEY}`;

                    const btn = document.createElement('a');
                    btn.className = 'download-btn';
                    btn.href = downloadProxyUrl;
                    btn.target = '_blank';
                    btn.innerHTML = `
                        <span>Download Stream</span>
                        <span class="quality-badge">${qualityName}</span>
                    `;
                    downloadGrid.appendChild(btn);
                });
            }

            // 3. Fetch Subtitles
            fetchSubtitles(detailPath, season, episode);
        }

        // Fetch Subtitles Endpoint
        async function fetchSubtitles(detailPath, season, episode) {
            const subSelect = document.getElementById('subtitleSelect');
            subSelect.innerHTML = `<option value="">Subtitles Off</option>`;

            const subUrl = `/api/subtitles?id=${encodeURIComponent(detailPath)}&season=${season}&episode=${episode}`;
            const subRaw = await apiFetch(subUrl);
            const subsList = extractArray(subRaw);

            subsList.forEach((sub) => {
                const opt = document.createElement('option');
                opt.value = sub.url || sub.file;
                opt.textContent = sub.language || sub.lang || sub.label || 'Subtitle Track';
                subSelect.appendChild(opt);
            });
        }

        // Apply dynamically selected subtitles to HTML5 Video player
        function applySubtitle(subUrl) {
            const player = document.getElementById('videoPlayer');
            
            // Clear existing tracks
            const existingTracks = player.querySelectorAll('track');
            existingTracks.forEach(t => t.remove());

            if (!subUrl) return;

            // Append WebVTT/SRT Track
            const track = document.createElement('track');
            track.kind = 'subtitles';
            track.label = 'Selected Language';
            track.srclang = 'en';
            track.src = subUrl;
            track.default = true;

            player.appendChild(track);
            player.textTracks[0].mode = 'showing';
        }

        // Render Season & Episode Selectors for TV Series
        async function renderTvControls(detailPath, currentSeason, currentEpisode) {
            const container = document.getElementById('tvMatrixControls');
            if (container.children.length > 0) return; // Prevent duplicate rendering

            const matrixRaw = await apiFetch(`/api/episode-matrix?id=${encodeURIComponent(detailPath)}`);
            const matrix = matrixRaw || {};

            let html = `
                <div class="controls-row">
                    <div class="control-group">
                        <label>Season</label>
                        <select id="seasonPicker" class="custom-select" onchange="onTvChange('${detailPath}')">
            `;

            // Season options
            const seasons = matrix.seasons || [1, 2, 3];
            seasons.forEach(s => {
                const sNum = typeof s === 'object' ? s.season_number : s;
                html += `<option value="${sNum}" ${sNum == currentSeason ? 'selected' : ''}>Season ${sNum}</option>`;
            });

            html += `
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Episode</label>
                        <select id="episodePicker" class="custom-select" onchange="onTvChange('${detailPath}')">
            `;

            // Default episode items
            for (let i = 1; i <= 24; i++) {
                html += `<option value="${i}" ${i == currentEpisode ? 'selected' : ''}>Episode ${i}</option>`;
            }

            html += `
                        </select>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function onTvChange(detailPath) {
            const season = document.getElementById('seasonPicker').value;
            const episode = document.getElementById('episodePicker').value;
            loadStreamsAndSubtitles(detailPath, season, episode);
        }

        // Close Modal Helper
        function closeModal() {
            const modal = document.getElementById('mediaModal');
            const player = document.getElementById('videoPlayer');
            if (player) {
                player.pause();
                player.src = "";
            }
            modal.classList.remove('active');
            document.getElementById('tvMatrixControls').innerHTML = '';
        }

        // Close Modal when clicking outside content area
        window.onclick = function(event) {
            const modal = document.getElementById('mediaModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', loadHomePage);
    </script>
</body>
</html>
