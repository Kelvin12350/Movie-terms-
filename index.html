<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBox Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .aspect-poster { aspect-ratio: 2 / 3; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <header class="sticky top-0 z-30 bg-[#0b0f19]/90 backdrop-blur border-b border-gray-800 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row gap-3 items-center justify-between">
      <h1 class="text-xl font-bold tracking-wider text-red-500 uppercase cursor-pointer" onclick="loadDefault()">
        Movie<span class="text-white">Box</span>
      </h1>
      <form id="search-form" class="w-full sm:w-80 flex items-center">
        <input id="search-input" type="text" placeholder="Search movies, series..." class="w-full bg-gray-900 border border-gray-700 rounded-l-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500 text-white placeholder-gray-400" required />
        <button type="submit" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-r-lg text-sm font-semibold transition">Search</button>
      </form>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4">
    <div id="status-container" class="text-center py-8 hidden">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-red-500 border-t-transparent"></div>
      <p id="status-text" class="text-sm text-gray-400 mt-2">Loading...</p>
    </div>
    <div id="error-banner" class="hidden mb-4 bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg text-sm"></div>
    <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </main>

  <div id="player-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-2xl relative">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
        <div class="truncate pr-4">
          <h2 id="modal-title" class="font-semibold text-white truncate text-base">Playing Video</h2>
          <span id="stream-status" class="text-xs text-yellow-400">Resolving stream link...</span>
        </div>
        <button onclick="closePlayer()" class="text-gray-400 hover:text-white p-1 text-xl font-bold">✕</button>
      </div>

      <div class="relative bg-black w-full aspect-video flex items-center justify-center">
        <div id="stream-loader" class="absolute flex flex-col items-center gap-2">
          <div class="animate-spin rounded-full h-10 w-10 border-4 border-red-500 border-t-transparent"></div>
          <span class="text-xs text-gray-400">Fetching stream...</span>
        </div>
        <video id="video-element" class="w-full h-full hidden" controls playsinline autoplay></video>
      </div>

      <div id="quality-bar" class="p-3 bg-gray-950 flex items-center gap-2 flex-wrap border-t border-gray-800">
        <span class="text-xs text-gray-400 font-medium">Quality:</span>
        <div id="quality-buttons" class="flex gap-2"></div>
      </div>
    </div>
  </div>

  <script>
    const movieGrid = document.getElementById("movie-grid");
    const statusContainer = document.getElementById("status-container");
    const statusText = document.getElementById("status-text");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");
    const playerModal = document.getElementById("player-modal");
    const modalTitle = document.getElementById("modal-title");
    const streamStatus = document.getElementById("stream-status");
    const streamLoader = document.getElementById("stream-loader");
    const videoElement = document.getElementById("video-element");
    const qualityButtons = document.getElementById("quality-buttons");
    const errorBanner = document.getElementById("error-banner");

    let currentStreams = [];

    async function searchMovies(query) {
      showStatus(`Searching for "${query}"...`);
      movieGrid.innerHTML = "";
      errorBanner.classList.add("hidden");

      try {
        const res = await fetch('/api/search', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keyword: query, page: 1 })
        });
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const data = await res.json();
        
        hideStatus();
        renderCards(data.items || []);
      } catch (err) {
        showStatus(`Failed to search: ${err.message}`);
      }
    }

    function renderCards(items) {
      if (!items.length) {
        showStatus("No movies found.");
        return;
      }
      movieGrid.innerHTML = items.map(item => `
        <div onclick="openStream('${item.subjectId}', '${escapeHtml(item.title)}')" class="group bg-gray-900 border border-gray-800 hover:border-red-500 rounded-lg overflow-hidden cursor-pointer transition transform hover:-translate-y-1 shadow-md flex flex-col">
          <div class="relative w-full aspect-poster bg-gray-800 overflow-hidden">
            <img src="${item.poster || ''}" alt="${escapeHtml(item.title)}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/300x450/1f2937/9ca3af?text=No+Poster'" />
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between">
            <h3 class="font-semibold text-sm line-clamp-1 group-hover:text-red-400 text-gray-100">${escapeHtml(item.title)}</h3>
          </div>
        </div>
      `).join("");
    }

    async function openStream(subjectId, title) {
      modalTitle.textContent = title;
      streamStatus.textContent = "Resolving stream URLs...";
      streamLoader.classList.remove("hidden");
      
      videoElement.classList.add("hidden");
      errorBanner.classList.add("hidden");
      videoElement.pause();
      videoElement.src = "";
      
      qualityButtons.innerHTML = "";
      playerModal.classList.remove("hidden");

      try {
        const res = await fetch(`/api/stream?id=${subjectId}&se=0&ep=0`);
        if (!res.ok) throw new Error(`Stream Error (${res.status})`);
        const data = await res.json();

        if (!data.streams || !data.streams.length) throw new Error("No playable streams available.");

        currentStreams = data.streams;
        renderQualityButtons(currentStreams);
        selectQuality(0);
      } catch (err) {
        streamStatus.textContent = `Error: ${err.message}`;
        streamLoader.classList.add("hidden");
      }
    }

    function renderQualityButtons(streams) {
      qualityButtons.innerHTML = streams.map((stream, idx) => `
        <button onclick="selectQuality(${idx})" id="btn-quality-${idx}" class="px-2.5 py-1 text-xs rounded border border-gray-700 bg-gray-800 hover:bg-gray-700 text-gray-200">
          ${stream.quality || stream.resolution + 'p'}
        </button>
      `).join("");
    }

    function selectQuality(index) {
      const stream = currentStreams[index];
      if (!stream) return;

      // Smart routing based on MovieBox's official linkType flag
      if (stream.linkType === 2) {
          alert("This title is hosted on a third-party server. It will open in a new tab.");
          window.open(stream.url, '_blank');
          closePlayer();
          return;
      }

      document.querySelectorAll("#quality-buttons button").forEach((b, i) => {
        b.className = i === index 
          ? "px-2.5 py-1 text-xs rounded border border-red-500 bg-red-600 font-bold text-white"
          : "px-2.5 py-1 text-xs rounded border border-gray-700 bg-gray-800 hover:bg-gray-700 text-gray-200";
      });

      streamStatus.textContent = `Playing ${stream.quality || stream.resolution + 'p'}`;
      
      videoElement.pause();
      videoElement.src = "";
      videoElement.classList.add("hidden");

      // Load native video for official CDN links
      videoElement.src = stream.url;
      videoElement.classList.remove("hidden");
      streamLoader.classList.add("hidden");
      videoElement.play().catch(() => console.log("Press play manually."));
    }

    function closePlayer() {
      playerModal.classList.add("hidden");
      videoElement.pause();
      videoElement.src = "";
    }

    function showStatus(msg) {
      statusContainer.classList.remove("hidden");
      statusText.textContent = msg;
    }

    function hideStatus() { statusContainer.classList.add("hidden"); }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m]));
    }

    function loadDefault() {
      searchInput.value = "Avatar";
      searchMovies("Avatar");
    }

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = searchInput.value.trim();
      if (val) searchMovies(val);
    });

    loadDefault();
  </script>
</body>
</html>
