<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nameless Streamer</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --primary: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* --- Header & Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
            cursor: pointer;
        }

        .search-container {
            display: flex;
            gap: 10px;
        }

        .search-container input {
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #333;
            color: white;
            outline: none;
            width: 250px;
        }

        .search-container button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-container button:hover {
            background: #f40612;
        }

        /* --- Main Content & Grids --- */
        main {
            padding: 40px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #333;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h3 {
            margin: 0;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Modal (Details & Player) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 900px;
            border-radius: 10px;
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
        }
        
        .close-btn:hover { color: white; }

        .play-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }

        #videoPlayer {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            background: #000;
            display: none;
        }

        /* Loader */
        .loader {
            color: var(--text-muted);
            text-align: center;
            padding: 50px;
        }
        
        #errorFallback {
            margin-top: 15px;
            display: none;
            padding: 15px;
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid var(--primary);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="loadHome()">Nameless Stream</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for movies, TV...">
            <button id="searchBtn">Search</button>
        </div>
    </header>

    <main>
        <div id="contentArea">
            <!-- Dynamic grids will be injected here -->
        </div>
    </main>

    <!-- Details and Player Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle">Loading...</h2>
            <div id="modalDetails" style="color: var(--text-muted); line-height: 1.6;"></div>
            
            <button id="playBtn" class="play-btn" style="display: none;">▶ Play Stream</button>
            
            <div id="errorFallback">
                <p>The stream encountered an issue or was blocked by the host.</p>
                <a id="externalLink" href="#" target="_blank" class="play-btn" style="background: #333;">🔗 Open Direct Video Link</a>
            </div>

            <video id="videoPlayer" controls></video>
        </div>
    </div>

<script>
    const contentArea = document.getElementById('contentArea');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    
    const modal = document.getElementById('movieModal');
    const closeModalBtn = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDetails = document.getElementById('modalDetails');
    const playBtn = document.getElementById('playBtn');
    const videoPlayer = document.getElementById('videoPlayer');
    const errorFallback = document.getElementById('errorFallback');
    const externalLink = document.getElementById('externalLink');

    let currentVideoUrl = "";

    document.addEventListener('DOMContentLoaded', () => {
        loadHome();
    });

    searchBtn.addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) fetchSearch(query);
    });

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchBtn.click();
    });

    closeModalBtn.addEventListener('click', () => {
        modal.classList.remove('active');
        videoPlayer.pause();
        videoPlayer.style.display = 'none';
        videoPlayer.src = '';
        errorFallback.style.display = 'none';
    });

    videoPlayer.addEventListener('error', (e) => {
        console.error("Video Player Error Triggered:", videoPlayer.error);
        videoPlayer.style.display = 'none';
        errorFallback.style.display = 'block';
        externalLink.href = currentVideoUrl;
    });

    // Uses your Vercel proxy.js for JSON data
    async function fetchAPI(endpoint) {
        try {
            const response = await fetch(`/api/proxy?path=${encodeURIComponent(endpoint)}`);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return await response.json();
        } catch (error) {
            console.error("API Fetch Error:", error);
            return null;
        }
    }

    async function loadHome() {
        contentArea.innerHTML = '<div class="loader">Loading Trending Now...</div>';
        searchInput.value = ''; 
        const data = await fetchAPI('/home'); // Ensure your VPS has a /home route
        renderGrid(extractArray(data), "🔥 Trending Now");
    }

    async function fetchSearch(query) {
        contentArea.innerHTML = `<div class="loader">Searching for "${query}"...</div>`;
        const data = await fetchAPI(`/search?q=${encodeURIComponent(query)}`);
        renderGrid(extractArray(data), `Search Results: "${query}"`);
    }

    function renderGrid(items, sectionTitle) {
        if (!items || items.length === 0) {
            contentArea.innerHTML = `<h2 class="section-title">${sectionTitle}</h2><p style="color:var(--text-muted)">No items found.</p>`;
            return;
        }

        let html = `<h2 class="section-title">${sectionTitle}</h2><div class="grid">`;
        
        items.forEach(item => {
            const title = item.title || item.name || 'Unknown Title';
            const safeTitle = title.replace(/'/g, "\\'").replace(/"/g, '&quot;'); 
            
            const poster = item.poster_url || item.poster || item.image || item.cover || 'https://via.placeholder.com/300x450?text=No+Poster';
            const slug = item.slug || item.id;
            const id = item.subject_id || item.id || item.slug;

            html += `
                <div class="card" onclick="openDetails('${slug}', '${id}', '${safeTitle}')">
                    <img src="${poster}" alt="${title}" onerror="this.src='https://via.placeholder.com/300x450?text=Image+Error'">
                    <div class="card-info">
                        <h3>${title}</h3>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        contentArea.innerHTML = html;
    }

    async function openDetails(slug, fallbackId, fallbackTitle) {
        modal.classList.add('active');
        modalTitle.innerText = fallbackTitle || "Loading details...";
        modalDetails.innerHTML = "<p>Loading synopsis...</p>";
        playBtn.style.display = 'none';
        videoPlayer.style.display = 'none';
        errorFallback.style.display = 'none';

        const rawDetail = await fetchAPI(`/detail/${slug}`);
        
        let detail = rawDetail;
        if (rawDetail && (rawDetail.data || rawDetail.result || rawDetail.item)) {
            detail = rawDetail.data || rawDetail.result || rawDetail.item;
        }

        const title = (detail && (detail.title || detail.name)) || fallbackTitle;
        const desc = (detail && (detail.description || detail.synopsis || detail.plot)) || 'No description available for this title.';
        const year = (detail && (detail.year || detail.release_date)) ? ` (${detail.year || detail.release_date})` : '';

        modalTitle.innerText = title + year;
        modalDetails.innerHTML = `<p>${desc}</p>`;
        
        let realStreamId = fallbackId; 
        if (detail) {
            if (detail.subject_id) realStreamId = detail.subject_id;
            else if (detail.stream_id) realStreamId = detail.stream_id;
            else if (detail.streamId) realStreamId = detail.streamId;
            else if (detail.id) realStreamId = detail.id;
            else if (detail.episodes && detail.episodes.length > 0 && detail.episodes[0].id) {
                realStreamId = detail.episodes[0].id;
            }
        }

        playBtn.style.display = 'inline-block';
        playBtn.onclick = () => playStream(realStreamId, slug);
    }

    async function playStream(subjectId, slug) {
        playBtn.innerText = "⏳ Finding stream...";
        playBtn.disabled = true;
        errorFallback.style.display = 'none';

        const streamData = await fetchAPI(`/api/stream/${subjectId}?detail_path=${slug}`);
        
        if (streamData) {
            let streamUrl = null;

            if (streamData.sources && Array.isArray(streamData.sources) && streamData.sources.length > 0) {
                const bestSource = streamData.sources[streamData.sources.length - 1];
                streamUrl = bestSource.url;
            } else {
                streamUrl = streamData.url || streamData.stream_url || streamData.link || (typeof streamData === 'string' ? streamData : null);
            }

            if (streamUrl) {
                currentVideoUrl = streamUrl;
                playBtn.style.display = 'none';
                videoPlayer.style.display = 'block';
                
                // POINT DIRECTLY TO THE VPS TO BYPASS VERCEL TIMEOUTS
                const proxyUrl = `http://pterodactyl.namelesstech.space:25566/api/play?url=${encodeURIComponent(streamUrl)}`;
                
                videoPlayer.innerHTML = `<source src="${proxyUrl}" type="video/mp4">`;
                videoPlayer.load();
                videoPlayer.play().catch(e => {
                    console.error("Autoplay Blocked:", e);
                });
            } else {
                alert("No valid stream URL found in the API response.");
            }
        } else {
            alert("Failed to fetch the stream from the server.");
        }

        playBtn.innerText = "▶ Play Stream";
        playBtn.disabled = false;
    }

    function extractArray(data) {
        if (Array.isArray(data)) return data;
        if (data && data.sections) {
            const combined = [];
            data.sections.forEach(s => { if (s.items) combined.push(...s.items); });
            return combined;
        }
        if (data && data.results && Array.isArray(data.results)) return data.results;
        if (data && data.data && Array.isArray(data.data)) return data.data;
        if (data && data.items && Array.isArray(data.items)) return data.items;
        return [];
    }
</script>

</body>
</html>
