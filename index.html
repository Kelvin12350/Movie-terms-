<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrade Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="glass-panel border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-500 tracking-wider">PRO<span class="text-white">TRADE</span></h1>
        <div class="flex items-center space-x-4">
            <span class="bg-green-500/20 text-green-400 text-xs font-semibold px-3 py-1 rounded-full border border-green-500/30">
                PAPER TRADING ACTIVE
            </span>
            <div id="buyingPower" class="text-slate-300 font-mono">Balance: Loading...</div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-6 max-w-6xl mx-auto w-full">
        
        <!-- Search Section -->
        <div class="mb-8 relative">
            <input type="text" id="searchInput" placeholder="Search stock symbol (e.g., AAPL, TSLA)..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-lg py-4 px-6 text-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all uppercase placeholder:normal-case">
            <button onclick="searchStock()" class="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md px-6 transition-colors">
                Search
            </button>
        </div>

        <!-- Market Watchlist (Dynamic) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="marketGrid">
            <!-- Stock Cards will be injected here -->
        </div>

    </main>

    <!-- Buy Modal -->
    <div id="buyModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl transform transition-all scale-95 opacity-0" id="modalContent">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Buy <span id="modalSymbol" class="text-blue-500">AAPL</span></h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Current Price</label>
                    <div id="modalPrice" class="text-3xl font-mono">$0.00</div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Number of Shares</label>
                    <input type="number" id="shareAmount" min="1" value="1" class="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white focus:outline-none focus:border-blue-500 font-mono">
                </div>

                <div class="pt-4">
                    <button onclick="executeBuy()" id="buyBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-lg shadow-blue-900/50 transition-all active:scale-95">
                        Confirm Purchase
                    </button>
                </div>
                <div id="orderStatus" class="text-center text-sm font-medium hidden"></div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // API Configuration
        const API_KEY = 'PKEX3X5WDRNEBNOR6MXYJN3WZK';
        const API_SECRET = '5E9pmZycF5cykkf7pDX3XQZryxPuj3bmLeg8TdLVqJEj';
        
        const PAPER_URL = 'https://paper-api.alpaca.markets/v2';
        const DATA_URL = 'https://data.alpaca.markets/v2';

        const headers = {
            'APCA-API-KEY-ID': API_KEY,
            'APCA-API-SECRET-KEY': API_SECRET,
            'Content-Type': 'application/json'
        };

        // Popular stocks for initial load
        const popularStocks = ['AAPL', 'TSLA', 'MSFT', 'NVDA', 'AMZN', 'META'];

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            fetchAccount();
            loadPopularStocks();
        });

        // 1. Fetch Account Data (Buying Power)
        async function fetchAccount() {
            try {
                const response = await fetch(`${PAPER_URL}/account`, { headers });
                const data = await response.json();
                if(data.buying_power) {
                    document.getElementById('buyingPower').innerText = `Balance: $${parseFloat(data.buying_power).toLocaleString()}`;
                }
            } catch (error) {
                console.error("Account fetch error (likely CORS if in browser):", error);
            }
        }

        // 2. Load Market Data
        async function loadPopularStocks() {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = ''; // Clear

            // For demo purposes, we will mock the price display to ensure the UI looks good immediately, 
            // since live market data API might be restricted outside trading hours or blocked by browser CORS.
            popularStocks.forEach(symbol => {
                const mockPrice = (Math.random() * (300 - 100) + 100).toFixed(2);
                const mockChange = (Math.random() * (5 - -5) + -5).toFixed(2);
                const isPositive = mockChange >= 0;
                
                const card = `
                    <div class="glass-panel border border-slate-700 p-6 rounded-xl shadow-lg hover:border-blue-500/50 transition-colors cursor-pointer" onclick="openModal('${symbol}', ${mockPrice})">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-2xl font-bold tracking-tight">${symbol}</h3>
                            <span class="text-sm font-medium ${isPositive ? 'text-green-400' : 'text-red-400'} bg-slate-800 px-2 py-1 rounded">
                                ${isPositive ? '+' : ''}${mockChange}%
                            </span>
                        </div>
                        <div class="text-3xl font-mono">$${mockPrice}</div>
                        <button class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded transition-colors">
                            Trade ${symbol}
                        </button>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
        }

        // 3. Search Functionality
        function searchStock() {
            const input = document.getElementById('searchInput').value.toUpperCase().trim();
            if(!input) return;
            // In a real scenario, fetch exact price. Using mock for UI completion.
            const mockPrice = (Math.random() * 200 + 50).toFixed(2);
            openModal(input, mockPrice);
        }

        // 4. Modal Interactions
        let currentTradingSymbol = '';

        function openModal(symbol, price) {
            currentTradingSymbol = symbol;
            document.getElementById('modalSymbol').innerText = symbol;
            document.getElementById('modalPrice').innerText = `$${price}`;
            document.getElementById('shareAmount').value = 1;
            
            // Reset status
            const status = document.getElementById('orderStatus');
            status.className = 'text-center text-sm font-medium hidden';
            
            const modal = document.getElementById('buyModal');
            const content = document.getElementById('modalContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Trigger animation
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('buyModal');
            const content = document.getElementById('modalContent');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        // 5. Execute Buy Order
        async function executeBuy() {
            const qty = document.getElementById('shareAmount').value;
            const btn = document.getElementById('buyBtn');
            const status = document.getElementById('orderStatus');
            
            btn.innerHTML = 'Processing...';
            btn.disabled = true;

            const orderPayload = {
                symbol: currentTradingSymbol,
                qty: String(qty),
                side: 'buy',
                type: 'market',
                time_in_force: 'day'
            };

            try {
                const response = await fetch(`${PAPER_URL}/orders`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(orderPayload)
                });

                const data = await response.json();

                status.classList.remove('hidden');
                if(response.ok || data.status === 'accepted') {
                    status.innerHTML = `Success! Ordered ${qty} shares of ${currentTradingSymbol}.`;
                    status.className = 'text-center text-sm font-medium text-green-400 mt-4';
                    fetchAccount(); // Update balance
                } else {
                    // API might reject it if market is closed or due to CORS in browser
                    status.innerHTML = `Error: ${data.message || 'Check console (CORS or Market Closed)'}`;
                    status.className = 'text-center text-sm font-medium text-red-400 mt-4';
                }
            } catch (error) {
                status.classList.remove('hidden');
                status.innerHTML = `Network/CORS Error. Use a backend proxy.`;
                status.className = 'text-center text-sm font-medium text-yellow-400 mt-4';
                console.error(error);
            } finally {
                btn.innerHTML = 'Confirm Purchase';
                btn.disabled = false;
                setTimeout(closeModal, 3000);
            }
        }
    </script>
</body>
</html>
