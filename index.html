<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieBox Web Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js support for m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-slate-800 p-4 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black text-red-500 tracking-wider">MOVIEBOX</span>
        <span class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">Spün API</span>
      </div>
      
      <!-- Search Form -->
      <form id="searchForm" class="w-full sm:w-96 flex gap-2">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search movies, TV shows..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-500 transition-colors"
          required 
        />
        <button 
          type="submit" 
          class="bg-red-600 hover:bg-red-700 font-semibold text-sm px-5 py-2 rounded-lg transition-colors flex items-center justify-center shrink-0">
          Search
        </button>
      </form>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6">
    <!-- Initial / Status State -->
    <div id="statusMessage" class="text-center py-20 text-slate-400">
      <p class="text-xl font-medium">Search for a movie or TV show to start watching.</p>
    </div>

    <!-- Spinner -->
    <div id="loadingSpinner" class="hidden text-center py-20">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-700 border-t-red-500"></div>
      <p class="mt-4 text-slate-400 text-sm">Searching titles...</p>
    </div>

    <!-- Movie Grid -->
    <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden"></div>
  </main>

  <!-- Video Player Modal -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-4xl overflow-hidden relative shadow-2xl flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
        <div>
          <h3 id="modalTitle" class="font-bold text-lg text-white">Playing Stream</h3>
          <p id="modalSubtitle" class="text-xs text-slate-400">Select source quality if playback fails</p>
        </div>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white p-2 text-xl font-bold">✕</button>
      </div>

      <!-- Player Container -->
      <div class="bg-black relative aspect-video flex items-center justify-center">
        <video id="videoPlayer" controls autoplay class="w-full h-full"></video>
        <div id="streamLoading" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-sm hidden">
          <div class="animate-spin rounded-full h-8 w-8 border-2 border-slate-600 border-t-red-500 mb-2"></div>
          <span>Fetching stream links...</span>
        </div>
      </div>

      <!-- Stream Selectors / Source List -->
      <div class="p-4 overflow-y-auto max-h-48 border-t border-slate-800">
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Available Streams & Qualities</h4>
        <div id="streamSources" class="flex flex-wrap gap-2 text-xs">
          <!-- Dynamic stream buttons will load here -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // State & DOM Elements
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultsGrid = document.getElementById('resultsGrid');
    const statusMessage = document.getElementById('statusMessage');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const playerModal = document.getElementById('playerModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const videoPlayer = document.getElementById('videoPlayer');
    const modalTitle = document.getElementById('modalTitle');
    const streamSources = document.getElementById('streamSources');
    const streamLoading = document.getElementById('streamLoading');

    let hlsInstance = null;

    // Execute API requests through proxy function
    async function apiRequest(endpoint, options = {}) {
      const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return await response.json();
    }

    // Search Handler
    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const keyword = searchInput.value.trim();
      if (!keyword) return;

      statusMessage.classList.add('hidden');
      resultsGrid.classList.add('hidden');
      loadingSpinner.classList.remove('hidden');

      try {
        const data = await apiRequest('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keyword, page: 1 })
        });

        const items = data?.data?.items || data?.items || data?.list || [];
        renderResults(items);
      } catch (err) {
        console.error(err);
        statusMessage.innerHTML = `<p class="text-red-400">Failed to search. Please try again.</p>`;
        statusMessage.classList.remove('hidden');
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    });

    // Render Search Results
    function renderResults(items) {
      resultsGrid.innerHTML = '';

      if (!items || items.length === 0) {
        statusMessage.innerHTML = `<p class="text-slate-400">No movies or shows found.</p>`;
        statusMessage.classList.remove('hidden');
        return;
      }

      items.forEach(item => {
        const title = item.title || item.name || 'Untitled';
        const cover = item.cover?.url || item.poster || 'https://via.placeholder.com/300x450?text=No+Cover';
        const subjectId = item.subjectId || item.id;
        const type = item.detailType || item.type || 'Movie';

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-lg overflow-hidden cursor-pointer group hover:border-slate-700 transition-all hover:scale-105';
        card.innerHTML = `
          <div class="aspect-[2/3] w-full relative bg-slate-950 overflow-hidden">
            <img src="${cover}" alt="${title}" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity" loading="lazy" />
            <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur text-[10px] uppercase font-bold text-slate-300 px-2 py-0.5 rounded">
              ${type}
            </span>
          </div>
          <div class="p-3">
            <h4 class="font-semibold text-sm line-clamp-1 group-hover:text-red-400 transition-colors">${title}</h4>
            <p class="text-xs text-slate-500 mt-1">Tap to Watch</p>
          </div>
        `;

        card.addEventListener('click', () => openStreamModal(subjectId, title));
        resultsGrid.appendChild(card);
      });

      resultsGrid.classList.remove('hidden');
    }

    // Open Player Modal & Load Streams
    async function openStreamModal(subjectId, title) {
      modalTitle.textContent = title;
      playerModal.classList.remove('hidden');
      streamLoading.classList.remove('hidden');
      streamSources.innerHTML = '';
      resetPlayer();

      try {
        // Fetch movie streams (se=0&ep=0 for movies)
        const data = await apiRequest(`/stream/${subjectId}?se=0&ep=0`);
        const streams = data?.data?.list || data?.streams || data?.data || [];

        renderStreamOptions(streams);
      } catch (err) {
        console.error(err);
        streamSources.innerHTML = `<span class="text-red-400">Unable to load streams for this content.</span>`;
      } finally {
        streamLoading.classList.add('hidden');
      }
    }

    // Render Stream Option Buttons
    function renderStreamOptions(streams) {
      streamSources.innerHTML = '';

      if (!Array.isArray(streams) || streams.length === 0) {
        streamSources.innerHTML = `<span class="text-slate-400">No active stream URLs available.</span>`;
        return;
      }

      streams.forEach((stream, index) => {
        const streamUrl = stream.url || stream.streamUrl || (typeof stream === 'string' ? stream : null);
        const quality = stream.quality || stream.resolutions || `Server ${index + 1}`;

        if (!streamUrl) return;

        const btn = document.createElement('button');
        btn.className = 'bg-slate-800 hover:bg-red-600 text-slate-200 hover:text-white px-3 py-1.5 rounded transition-colors text-xs font-medium border border-slate-700';
        btn.textContent = `${quality}`;
        btn.addEventListener('click', () => playStream(streamUrl));

        streamSources.appendChild(btn);
      });

      // Auto-play first available stream
      const firstStream = streams[0]?.url || streams[0]?.streamUrl || (typeof streams[0] === 'string' ? streams[0] : null);
      if (firstStream) {
        playStream(firstStream);
      }
    }

    // Play HLS/MP4 Stream
    function playStream(url) {
      resetPlayer();

      if (Hls.isSupported() && url.includes('.m3u8')) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoPlayer);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoPlayer.play();
        });
      } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl') || url.includes('.mp4')) {
        videoPlayer.src = url;
        videoPlayer.play();
      } else {
        videoPlayer.src = url;
        videoPlayer.play();
      }
    }

    function resetPlayer() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load();
    }

    // Modal Close logic
    closeModalBtn.addEventListener('click', () => {
      resetPlayer();
      playerModal.classList.add('hidden');
    });

    playerModal.addEventListener('click', (e) => {
      if (e.target === playerModal) {
        resetPlayer();
        playerModal.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
