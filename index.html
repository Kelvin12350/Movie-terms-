<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#111827]/95 backdrop-blur border-b border-gray-800 px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex flex-col gap-3">
      
      <!-- Top Row: Logo & Search -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-3 cursor-pointer self-start sm:self-auto" onclick="switchTab('home')">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-rose-900/40">
            <i class="fa-solid fa-play text-white text-sm"></i>
          </div>
          <span class="text-xl font-black tracking-wider uppercase bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">MovieBox</span>
        </div>

        <!-- Search Bar -->
        <form id="searchForm" class="w-full sm:w-96 flex relative">
          <input 
            id="searchInput"
            type="text" 
            placeholder="Search movies, anime, K-drama..." 
            class="w-full bg-gray-900 text-sm rounded-xl pl-10 pr-24 py-2 border border-gray-700 focus:outline-none focus:border-rose-500 transition"
          >
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
          <button 
            type="submit" 
            class="absolute right-1 top-1 bottom-1 px-4 bg-rose-600 hover:bg-rose-700 text-xs font-semibold rounded-lg transition"
          >
            Search
          </button>
        </form>
      </div>

      <!-- Navigation Bar -->
      <nav class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1 pb-1">
        <button id="nav-home" onclick="switchTab('home')" class="nav-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-rose-600 text-white transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-fire text-amber-300"></i> Home
        </button>
        <button id="nav-anime" onclick="switchTab('anime')" class="nav-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-900 hover:bg-gray-800 text-gray-300 transition flex items-center gap-1.5 border border-gray-800">
          <i class="fa-solid fa-bolt text-indigo-400"></i> Anime
        </button>
        <button id="nav-kdrama" onclick="switchTab('kdrama')" class="nav-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-900 hover:bg-gray-800 text-gray-300 transition flex items-center gap-1.5 border border-gray-800">
          <i class="fa-solid fa-heart text-pink-400"></i> K-Drama
        </button>
        <button id="nav-movies" onclick="switchTab('movies')" class="nav-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-900 hover:bg-gray-800 text-gray-300 transition flex items-center gap-1.5 border border-gray-800">
          <i class="fa-solid fa-film text-emerald-400"></i> Movies
        </button>
        <button id="nav-series" onclick="switchTab('series')" class="nav-btn px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-900 hover:bg-gray-800 text-gray-300 transition flex items-center gap-1.5 border border-gray-800">
          <i class="fa-solid fa-tv text-cyan-400"></i> TV Series
        </button>
      </nav>

    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-4 lg:p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 id="sectionTitle" class="text-xl font-bold tracking-wide flex items-center gap-2">
        <i class="fa-solid fa-fire text-amber-500"></i> Trending Now
      </h2>
      <button onclick="switchTab('home')" class="text-xs text-gray-400 hover:text-white transition">Reset</button>
    </div>

    <!-- Media Grid -->
    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 lg:gap-6"></div>

    <!-- Loader -->
    <div id="loader" class="hidden flex justify-center items-center py-24">
      <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-rose-500"></div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 text-gray-400">
      <i class="fa-solid fa-film text-4xl mb-3 block"></i>
      No titles found. Try searching for something else.
    </div>
  </main>

  <!-- Player & Download Modal -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-[#111827] border border-gray-800 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl relative flex flex-col">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute right-4 top-4 z-10 w-8 h-8 rounded-full bg-gray-900/80 hover:bg-gray-800 flex items-center justify-center border border-gray-700 transition">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>

      <!-- Video Player Frame -->
      <div class="w-full bg-black aspect-video relative flex items-center justify-center">
        <video id="videoPlayer" controls class="w-full h-full" playsinline preload="metadata">
          Your browser does not support the video tag.
        </video>
        <div id="playerSpinner" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center">
          <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-rose-500"></div>
        </div>
      </div>

      <!-- Controls & Metadata -->
      <div class="p-6 space-y-5 custom-scrollbar max-h-[45vh] overflow-y-auto">
        <div>
          <h3 id="modalTitle" class="text-xl font-bold">Title</h3>
          <p id="modalMeta" class="text-xs text-gray-400 mt-1"></p>
        </div>

        <!-- TV Show Episode Selectors -->
        <div id="tvControls" class="hidden grid grid-cols-2 gap-3 bg-gray-900/60 p-3 rounded-xl border border-gray-800">
          <div>
            <label class="text-xs font-semibold text-gray-400 block mb-1">Season</label>
            <select id="seasonSelect" onchange="onSeasonChange()" class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg p-2 focus:outline-none"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-400 block mb-1">Episode</label>
            <select id="episodeSelect" onchange="fetchEpisodeStream()" class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg p-2 focus:outline-none"></select>
          </div>
        </div>

        <!-- Quality Pills -->
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Available Qualities</label>
          <div id="qualityPills" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Actions -->
        <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-gray-800">
          <a id="downloadBtn" href="#" target="_blank" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold uppercase rounded-lg flex items-center gap-2 shadow-lg transition">
            <i class="fa-solid fa-download"></i> Download Video
          </a>
          <button onclick="copyStreamLink()" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-lg flex items-center gap-2 border border-gray-700 transition">
            <i class="fa-regular fa-copy"></i> Copy Stream URL
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const BASE_API = '/proxy-api';
    const STREAM_PROXY = '/proxy-api/stream';
    const DL_PROXY = '/proxy-api/dl';

    let currentItem = null;
    let fullDetails = null;

    const grid = document.getElementById('grid');
    const loader = document.getElementById('loader');
    const emptyState = document.getElementById('emptyState');
    const playerModal = document.getElementById('playerModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerSpinner = document.getElementById('playerSpinner');
    const qualityPills = document.getElementById('qualityPills');
    const downloadBtn = document.getElementById('downloadBtn');
    const tvControls = document.getElementById('tvControls');

    // Safe array parser to avoid TypeError: items.forEach is not a function
    function extractArray(data) {
      if (Array.isArray(data)) return data;
      if (!data || typeof data !== 'object') return [];
      const knownKeys = ['results', 'items', 'trending', 'list', 'data', 'subjects'];
      for (const k of knownKeys) {
        if (Array.isArray(data[k])) return data[k];
      }
      for (const k in data) {
        if (Array.isArray(data[k])) return data[k];
      }
      return [];
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTrending();

      document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
          clearNavActive();
          searchMovies(query);
        }
      });
    });

    // Navigation Tab Controller
    function switchTab(tab) {
      clearNavActive();
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-gray-900', 'text-gray-300', 'border-gray-800');
        activeBtn.classList.add('bg-rose-600', 'text-white');
      }

      if (tab === 'home') {
        loadTrending();
      } else if (tab === 'anime') {
        loadCategory('anime', '<i class="fa-solid fa-bolt text-indigo-400"></i> Popular Anime');
      } else if (tab === 'kdrama') {
        loadCategory('korean drama', '<i class="fa-solid fa-heart text-pink-400"></i> K-Drama Series & Movies');
      } else if (tab === 'movies') {
        loadCategory('2024 movie', '<i class="fa-solid fa-film text-emerald-400"></i> Popular Movies');
      } else if (tab === 'series') {
        loadCategory('series', '<i class="fa-solid fa-tv text-cyan-400"></i> Top TV Series');
      }
    }

    function clearNavActive() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-rose-600', 'text-white');
        btn.classList.add('bg-gray-900', 'text-gray-300', 'border-gray-800');
      });
    }

    async function loadTrending() {
      document.getElementById('sectionTitle').innerHTML = '<i class="fa-solid fa-fire text-amber-500"></i> Trending Now';
      showLoader(true);
      try {
        const res = await fetch(`${BASE_API}/api/trending?limit=24`);
        const data = await res.json();
        renderGrid(extractArray(data));
      } catch (err) {
        console.error('loadTrending error:', err);
        renderGrid([]);
      } finally {
        showLoader(false);
      }
    }

    async function loadCategory(query, titleHtml) {
      document.getElementById('sectionTitle').innerHTML = titleHtml;
      showLoader(true);
      try {
        const res = await fetch(`${BASE_API}/api/search?q=${encodeURIComponent(query)}&limit=24`);
        const data = await res.json();
        renderGrid(extractArray(data));
      } catch (err) {
        console.error('loadCategory error:', err);
        renderGrid([]);
      } finally {
        showLoader(false);
      }
    }

    async function searchMovies(query) {
      document.getElementById('sectionTitle').innerText = `Search: "${query}"`;
      showLoader(true);
      try {
        const res = await fetch(`${BASE_API}/api/search?q=${encodeURIComponent(query)}&limit=24`);
        const data = await res.json();
        renderGrid(extractArray(data));
      } catch (err) {
        console.error('searchMovies error:', err);
        renderGrid([]);
      } finally {
        showLoader(false);
      }
    }

    function renderGrid(items) {
      grid.innerHTML = '';
      if (!Array.isArray(items) || items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'group bg-gray-900 rounded-xl overflow-hidden border border-gray-800 hover:border-rose-500/50 transition cursor-pointer flex flex-col';
        card.onclick = () => openDetails(item);

        const cover = item.cover || 'https://via.placeholder.com/300x450?text=No+Cover';
        const isTv = item.type === 'tv';

        card.innerHTML = `
          <div class="aspect-[2/3] w-full overflow-hidden relative">
            <img src="${cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" />
            <div class="absolute top-2 right-2 px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${isTv ? 'bg-indigo-600' : 'bg-rose-600'} text-white">
              ${isTv ? 'TV' : 'Movie'}
            </div>
            ${item.imdbRating ? `<div class="absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 rounded text-xs text-amber-400 font-bold flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ${item.imdbRating}</div>` : ''}
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <h4 class="text-sm font-semibold truncate group-hover:text-rose-400 transition">${item.title}</h4>
            <p class="text-[11px] text-gray-500 mt-1">${item.releaseDate ? item.releaseDate.split('-')[0] : (item.genre || '')}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function openDetails(item) {
      currentItem = { ...item };
      playerModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalMeta').innerText = 'Loading details...';
      tvControls.classList.add('hidden');
      qualityPills.innerHTML = '<span class="text-xs text-gray-400">Checking streams...</span>';
      setPlayerLoading(true);

      try {
        const res = await fetch(`${BASE_API}/api/details?id=${encodeURIComponent(item.detailPath)}`);
        fullDetails = await res.json();

        const trueType = fullDetails.type || item.type || 'movie';
        currentItem.type = trueType;
        document.getElementById('modalTitle').innerText = fullDetails.title || item.title;
        document.getElementById('modalMeta').innerText = `${trueType.toUpperCase()} • ${fullDetails.genre || item.genre || ''}`;

        if (trueType === 'tv' && fullDetails.seasons && fullDetails.seasons.length > 0) {
          tvControls.classList.remove('hidden');
          setupTvSeasons(fullDetails.seasons);
        } else if (trueType === 'tv') {
          tvControls.classList.remove('hidden');
          setupFallbackSeasons();
        } else {
          tvControls.classList.add('hidden');
          await loadMovieStream(item.detailPath);
        }
      } catch (err) {
        console.error('Error fetching details:', err);
        if (item.type === 'tv') {
          tvControls.classList.remove('hidden');
          setupFallbackSeasons();
        } else {
          tvControls.classList.add('hidden');
          await loadMovieStream(item.detailPath);
        }
      } finally {
        setPlayerLoading(false);
      }
    }

    function setupTvSeasons(seasons) {
      const seasonSelect = document.getElementById('seasonSelect');
      seasonSelect.innerHTML = '';
      seasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.season;
        opt.innerText = `Season ${s.season}`;
        seasonSelect.appendChild(opt);
      });
      onSeasonChange();
    }

    function setupFallbackSeasons() {
      const seasonSelect = document.getElementById('seasonSelect');
      seasonSelect.innerHTML = '<option value="1">Season 1</option>';
      populateEpisodes(24);
      fetchEpisodeStream();
    }

    function onSeasonChange() {
      const seasonNum = parseInt(document.getElementById('seasonSelect').value);
      const seasonData = fullDetails?.seasons?.find(s => s.season === seasonNum);
      populateEpisodes(seasonData ? seasonData.maxEp : 24);
      fetchEpisodeStream();
    }

    function populateEpisodes(maxEp) {
      const epSelect = document.getElementById('episodeSelect');
      epSelect.innerHTML = '';
      for (let i = 1; i <= maxEp; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Episode ${i}`;
        epSelect.appendChild(opt);
      }
    }

    async function loadMovieStream(detailPath) {
      setPlayerLoading(true);
      try {
        const res = await fetch(`${BASE_API}/api/movie?id=${encodeURIComponent(detailPath)}`);
        const data = await res.json();
        
        // Auto-heal: If backend says it is a TV show
        if (data.error && (data.error.includes('/api/tv') || data.error.includes('TV show'))) {
          currentItem.type = 'tv';
          tvControls.classList.remove('hidden');
          setupFallbackSeasons();
          return;
        }

        if (data.qualities && data.qualities.length > 0) {
          renderQualities(data.qualities, data.title || currentItem.title);
        } else {
          qualityPills.innerHTML = `<span class="text-xs text-rose-400">${data.error || 'Stream limit hit. Retry in 2 minutes.'}</span>`;
        }
      } catch (err) {
        console.error(err);
        qualityPills.innerHTML = `<span class="text-xs text-rose-500">Failed to fetch movie stream.</span>`;
      } finally {
        setPlayerLoading(false);
      }
    }

    async function fetchEpisodeStream() {
      setPlayerLoading(true);
      const season = document.getElementById('seasonSelect').value || 1;
      const episode = document.getElementById('episodeSelect').value || 1;

      try {
        const res = await fetch(`${BASE_API}/api/tv?id=${encodeURIComponent(currentItem.detailPath)}&season=${season}&episode=${episode}`);
        const data = await res.json();

        // Auto-heal: If backend says it is a movie
        if (data.error && (data.error.includes('/api/movie') || data.error.includes('subject is a movie'))) {
          currentItem.type = 'movie';
          tvControls.classList.add('hidden');
          document.getElementById('modalMeta').innerText = `MOVIE • ${currentItem.genre || ''}`;
          return await loadMovieStream(currentItem.detailPath);
        }

        if (data.qualities && data.qualities.length > 0) {
          renderQualities(data.qualities, `${currentItem.title}_S${season}E${episode}`);
        } else {
          qualityPills.innerHTML = `<span class="text-xs text-rose-400">${data.error || 'No stream files found for this episode.'}</span>`;
        }
      } catch (err) {
        console.error(err);
        qualityPills.innerHTML = `<span class="text-xs text-rose-500">Failed to load episode stream.</span>`;
      } finally {
        setPlayerLoading(false);
      }
    }

    function renderQualities(qualities, baseTitle) {
      qualityPills.innerHTML = '';
      let defaultChosen = false;

      qualities.forEach((q) => {
        const btn = document.createElement('button');
        const isVip = q.vipLocked;
        btn.disabled = isVip;

        btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${
          isVip 
            ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-800' 
            : 'bg-gray-800 hover:bg-rose-600 text-gray-200 hover:text-white border border-gray-700'
        }`;

        btn.innerHTML = `
          <span>${q.resolution}P</span>
          ${q.size_mb ? `<span class="text-[10px] text-gray-400">(${q.size_mb} MB)</span>` : ''}
          ${isVip ? '<i class="fa-solid fa-lock text-[10px]"></i>' : ''}
        `;

        btn.onclick = () => selectStreamQuality(q, baseTitle, btn);
        qualityPills.appendChild(btn);

        if (!defaultChosen && !isVip) {
          selectStreamQuality(q, baseTitle, btn);
          defaultChosen = true;
        }
      });
    }

    function selectStreamQuality(qualityObj, baseTitle, targetBtn) {
      Array.from(qualityPills.children).forEach(el => {
        el.classList.remove('bg-rose-600', 'border-rose-500', 'text-white');
      });
      if (targetBtn) {
        targetBtn.classList.add('bg-rose-600', 'border-rose-500', 'text-white');
      }

      const dp = encodeURIComponent(currentItem.detailPath || '');
      const rawUrl = encodeURIComponent(qualityObj.url);
      const cleanName = encodeURIComponent(`${baseTitle}_${qualityObj.resolution}p.mp4`);

      // 1. Play inline via /stream
      const playUrl = `${STREAM_PROXY}?url=${rawUrl}&dp=${dp}`;
      videoPlayer.src = playUrl;
      videoPlayer.load();
      videoPlayer.play().catch(() => {});

      // 2. Direct download via /dl
      const downloadUrl = `${DL_PROXY}?url=${rawUrl}&name=${cleanName}&dp=${dp}`;
      downloadBtn.href = downloadUrl;
    }

    function closeModal() {
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load();
      playerModal.classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function copyStreamLink() {
      if (videoPlayer.src) {
        navigator.clipboard.writeText(videoPlayer.src);
        alert('Stream URL copied to clipboard!');
      }
    }

    function showLoader(visible) {
      loader.classList.toggle('hidden', !visible);
    }

    function setPlayerLoading(visible) {
      playerSpinner.classList.toggle('hidden', !visible);
    }
  </script>
</body>
</html>
