<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reverse & Shadow Clone Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #070a12;
            color: #f8fafc;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            background-color: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            z-index: 1;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .screen.hidden {
            display: none !important;
        }

        .hidden {
            display: none !important;
        }

        /* ================= HOME SCREEN ================= */
        .home-screen {
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 70%);
            padding: 24px 20px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            overflow-y: auto;
            justify-content: space-between;
        }

        .home-header {
            text-align: center;
            margin-top: 15px;
        }

        .magic-icon-wrapper {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .magic-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            filter: blur(16px);
            opacity: 0.7;
            animation: pulseGlow 2.5s infinite alternate;
        }

        .magic-badge {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 22px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .magic-wand-svg {
            animation: wandFloat 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 0.85; }
        }

        @keyframes wandFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(6deg); }
        }

        .home-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f3e8ff, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
        }

        .card-btn {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        .card-btn:active {
            transform: scale(0.96);
            border-color: #a855f7;
            background: rgba(49, 46, 129, 0.5);
        }

        .icon-circle {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
        }

        .icon-circle.clone {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.35);
        }

        .card-btn span {
            font-weight: 600;
            font-size: 0.9rem;
            color: #f8fafc;
        }

        .pro-banner {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* ================= SETUP / CONFIG SCREEN ================= */
        .config-header {
            padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1e293b;
        }

        .config-body {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
        }

        .btn-launch {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: auto;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* ================= CAMERA SCREEN ================= */
        .camera-viewport {
            position: relative;
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
            will-change: transform;
        }

        #cameraCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #webcam.fit-screen {
            object-fit: contain;
        }

        .camera-top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }

        .icon-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(168, 85, 247, 0.4);
        }

        .rec-indicator {
            position: absolute;
            top: calc(70px + env(safe-area-inset-top));
            left: 20px;
            background: rgba(220, 38, 38, 0.95);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 10;
            transition: background 0.3s ease;
        }

        .rec-indicator.paused {
            background: rgba(234, 179, 8, 0.95);
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .camera-bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 30px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            z-index: 10;
        }

        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid white;
            background: transparent;
            padding: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shutter-inner {
            width: 100%;
            height: 100%;
            background: #ef4444;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .shutter-btn.recording .shutter-inner {
            border-radius: 8px;
            transform: scale(0.5);
        }

        /* ================= REVIEW SCREEN ================= */
        .review-header {
            padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
        }

        .review-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .btn-download-top {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        .review-viewport {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #reviewCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .review-toolbar {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: #0f172a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1e293b;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tool-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
            color: #f8fafc;
        }

        .tool-circle.main {
            background: linear-gradient(135deg, #a855f7, #2563eb);
            border: none;
        }

        /* ================= MODAL & TOAST ================= */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: #1e293b;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            color: #f8fafc;
        }

        .modal-option {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .toast {
            position: absolute;
            bottom: calc(80px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #a855f7;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 200;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-viewport">

        <!-- 1. HOME SCREEN -->
        <div id="homeScreen" class="screen home-screen">
            <div class="home-header">
                <div class="magic-icon-wrapper">
                    <div class="magic-glow"></div>
                    <div class="magic-badge">
                        <svg class="magic-wand-svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="m19 2 2 2-2 2-2-2 2-2z"/>
                            <path d="m5 7 2 2-2 2-2-2 2-2z"/>
                            <path d="m15 11 2 2-2 2-2-2 2-2z"/>
                            <path d="M4 20l9-9"/>
                            <path d="M15 9l2-2"/>
                        </svg>
                    </div>
                </div>

                <h1 class="home-title">SHADOW & REVERSE</h1>
                <p class="home-subtitle">Magic FX Studio</p>
            </div>

            <div class="home-grid">
                <div class="card-btn" id="btnOpenReverse">
                    <div class="icon-circle">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
                            <path d="M11 16.07V7.93c0-.77-.84-1.25-1.51-.86l-6.28 4.07c-.63.41-.63 1.32 0 1.73l6.28 4.07c.67.39 1.51-.09 1.51-.87zm10 0V7.93c0-.77-.84-1.25-1.51-.86l-6.28 4.07c-.63.41-.63 1.32 0 1.73l6.28 4.07c.67.39 1.51-.09 1.51-.87z"/>
                        </svg>
                    </div>
                    <span>Reverse Video</span>
                </div>

                <div class="card-btn" id="btnOpenShadowClone">
                    <div class="icon-circle clone">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            <path d="M4 10c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 1.5c-1.5 0-4 .75-4 2.25V15h3v-1.25c0-.44.22-.86.6-1.18-.36-.05-.72-.07-1.1-.07z" opacity="0.6"/>
                            <path d="M20 10c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 1.5c.38 0 .74.02 1.1.07.38.32.6.74.6 1.18V15h3v-1.25c0-1.5-2.5-2.25-4-2.25z" opacity="0.6"/>
                        </svg>
                    </div>
                    <span>Shadow Clone</span>
                </div>
            </div>

            <div class="pro-banner">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <div>
                    <div style="font-weight:700; font-size:0.88rem; color:#f8fafc;">Ultra-HD Clone Engine</div>
                    <div style="font-size:0.75rem; color:#94a3b8;">Real-time Ninja Smoke & Multi-Layer Split</div>
                </div>
            </div>
        </div>

        <!-- 2. SHADOW CLONE CONFIGURATION SCREEN -->
        <div id="configScreen" class="screen hidden">
            <div class="config-header">
                <button class="icon-btn" id="btnBackFromConfig">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <h2 style="font-size:1.1rem; font-weight:700;">Shadow Clone Studio</h2>
            </div>

            <div class="config-body">
                <div class="form-group">
                    <label class="form-label">When should the clone take place?</label>
                    <select id="cloneTimeSelect" class="select-input">
                        <option value="2">After 2 Seconds</option>
                        <option value="3" selected>After 3 Seconds</option>
                        <option value="5">After 5 Seconds</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">How many clones do you want?</label>
                    <select id="cloneCountSelect" class="select-input">
                        <option value="2">2 Clones (Side-by-Side)</option>
                        <option value="3" selected>3 Clones (Triple Jutsu)</option>
                    </select>
                </div>

                <button class="btn-launch" id="btnLaunchCloneCam">
                    <span>Start Clone Camera</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <!-- 3. FULL SCREEN CAMERA SCREEN -->
        <div id="cameraScreen" class="screen hidden">
            <div class="camera-top-bar">
                <button class="icon-btn" id="btnCloseCamera">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>

                <div style="display:flex; gap:10px;">
                    <button class="icon-btn" id="btnToggleFit" title="Toggle Aspect">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>
                    <button class="icon-btn" id="btnFlipCamera">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8e0 1.38.35 2.63 1 .38l2.12-2.12M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8e0-1.38-.35-2.63-1-.38l-2.12 2.12"/><path d="M4 4v6h6M20 20v-6h-6"/></svg>
                    </button>
                </div>
            </div>

            <div id="recBadge" class="rec-indicator hidden">
                <div class="rec-dot"></div>
                <span id="recTimer">REC 00:00</span>
            </div>

            <div class="camera-viewport">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="cameraCanvas"></canvas>
            </div>

            <div class="camera-bottom-bar">
                <button class="icon-btn hidden" id="btnPauseRec">
                    <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>
                    <svg id="playIcon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>

                <button class="shutter-btn" id="btnShutter">
                    <div class="shutter-inner"></div>
                </button>

                <div style="width:44px;"></div>
            </div>
        </div>

        <!-- 4. REVIEW SCREEN -->
        <div id="reviewScreen" class="screen hidden">
            <div class="review-header">
                <button class="icon-btn" id="btnBackToCam" style="width:36px; height:36px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <h2 id="reviewTitle">Preview</h2>
                <button class="btn-download-top" id="btnOpenDownload">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    Download
                </button>
            </div>

            <div class="review-viewport">
                <canvas id="reviewCanvas"></canvas>
            </div>

            <div class="review-toolbar">
                <button class="tool-btn" id="btnToggleMute">
                    <div class="tool-circle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>
                    </div>
                    <span>Mute</span>
                </button>

                <button class="tool-btn" id="btnTogglePlay">
                    <div class="tool-circle main">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <span>Replay</span>
                </button>

                <button class="tool-btn" id="btnAddMusic">
