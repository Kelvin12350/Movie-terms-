<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Video Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* Overlay for status and loader */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #38bdf8;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Recording Indicator Badge */
        .recording-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #ef4444;
            color: white;
        }

        .btn-primary:hover {
            background-color: #dc2626;
        }

        .btn-stop {
            background-color: #f59e0b;
            color: white;
        }

        .btn-stop:hover {
            background-color: #d97706;
        }

        .btn-secondary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #2563eb;
        }

        .btn:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏪ Reverse Video Studio</h1>

        <div class="video-container">
            <!-- Live Preview Video -->
            <video id="webcam" autoplay playsinline muted></video>

            <!-- Reversed Video Output Canvas -->
            <canvas id="canvas" class="hidden"></canvas>

            <!-- Recording Indicator -->
            <div id="recordingBadge" class="recording-badge hidden">
                <div class="dot"></div> Recording...
            </div>

            <!-- Processing Overlay -->
            <div id="processingOverlay" class="overlay hidden">
                <div class="spinner"></div>
                <p id="progressText">Processing frames: 0%</p>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-secondary">Enable Camera</button>
            <button id="recordBtn" class="btn btn-primary hidden">Start Recording</button>
            <button id="stopBtn" class="btn btn-stop hidden">Stop & Reverse</button>
            <button id="resetBtn" class="btn btn-secondary hidden">Record Again</button>
        </div>
    </div>

    <script>
        const webcam = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const startBtn = document.getElementById('startBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        const recordingBadge = document.getElementById('recordingBadge');
        const processingOverlay = document.getElementById('processingOverlay');
        const progressText = document.getElementById('progressText');

        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let frames = [];
        let animationFrameId = null;

        // Step 1: Start Camera Stream
        startBtn.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                    audio: false 
                });
                webcam.srcObject = mediaStream;
                
                startBtn.classList.add('hidden');
                recordBtn.classList.remove('hidden');
            } catch (err) {
                alert('Camera access error: ' + err.message);
            }
        });

        // Step 2: Start Recording
        recordBtn.addEventListener('click', () => {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(mediaStream);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.start();
            recordingBadge.classList.remove('hidden');
            recordBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
        });

        // Step 3: Stop Recording & Process Frames
        stopBtn.addEventListener('click', () => {
            recordingBadge.classList.add('hidden');
            stopBtn.classList.add('hidden');
            processingOverlay.classList.remove('hidden');

            mediaRecorder.stop();
            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                await processAndReverse(blob);
            };
        });

        // Step 4: Extract Frames & Reverse
        async function processAndReverse(videoBlob) {
            const videoUrl = URL.createObjectURL(videoBlob);
            const tempVideo = document.createElement('video');
            tempVideo.src = videoUrl;
            tempVideo.muted = true;
            tempVideo.playsInline = true;

            await new Promise((resolve) => {
                tempVideo.onloadedmetadata = resolve;
            });

            // Match canvas dimensions to video aspect ratio
            canvas.width = tempVideo.videoWidth || 640;
            canvas.height = tempVideo.videoHeight || 480;

            const duration = tempVideo.duration;
            const fps = 30; // Frames per second
            const totalFrames = Math.floor(duration * fps);
            
            // Clean up old frames if any
            frames.forEach(frame => frame.close && frame.close());
            frames = [];

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Extract frames step by step
            for (let i = 0; i < totalFrames; i++) {
                const time = i / fps;
                tempVideo.currentTime = time;

                await new Promise((resolve) => {
                    const onSeeked = () => {
                        tempVideo.removeEventListener('seeked', onSeeked);
                        resolve();
                    };
                    tempVideo.addEventListener('seeked', onSeeked);
                    
                    // Fallback timeout in case seeked doesn't trigger
                    setTimeout(onSeeked, 150);
                });

                tempCtx.drawImage(tempVideo, 0, 0, tempCanvas.width, tempCanvas.height);
                const bitmap = await createImageBitmap(tempCanvas);
                frames.push(bitmap);

                // Update UI progress
                const percent = Math.round(((i + 1) / totalFrames) * 100);
                progressText.innerText = `Processing frames: ${percent}%`;
            }

            // Cleanup Blob URL
            URL.revokeObjectURL(videoUrl);

            // Reverse extracted frame array
            frames.reverse();

            // Switch view from Live Webcam to Canvas
            processingOverlay.classList.add('hidden');
            webcam.classList.add('hidden');
            canvas.classList.remove('hidden');
            resetBtn.classList.remove('hidden');

            // Play the reversed frames in a loop
            playReversedLoop();
        }

        // Step 5: Animation loop for canvas playback
        let frameIndex = 0;
        let lastTimestamp = 0;
        const frameInterval = 1000 / 30; // ~33ms for 30fps

        function playReversedLoop(timestamp = 0) {
            animationFrameId = requestAnimationFrame(playReversedLoop);

            const elapsed = timestamp - lastTimestamp;
            if (elapsed > frameInterval) {
                lastTimestamp = timestamp - (elapsed % frameInterval);

                if (frames.length > 0) {
                    ctx.drawImage(frames[frameIndex], 0, 0, canvas.width, canvas.height);
                    frameIndex = (frameIndex + 1) % frames.length;
                }
            }
        }

        // Step 6: Reset App state for a new recording
        resetBtn.addEventListener('click', () => {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            // Memory cleanup
            frames.forEach(frame => frame.close && frame.close());
            frames = [];
            frameIndex = 0;

            // Reset UI
            canvas.classList.add('hidden');
            webcam.classList.remove('hidden');
            resetBtn.classList.add('hidden');
            recordBtn.classList.remove('hidden');
        });
    </script>
</body>
</html>
