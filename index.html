<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Video Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* Recording Indicator Badge */
        .recording-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #ef4444;
            color: white;
        }

        .btn-primary:hover {
            background-color: #dc2626;
        }

        .btn-stop {
            background-color: #f59e0b;
            color: white;
        }

        .btn-stop:hover {
            background-color: #d97706;
        }

        .btn-secondary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #2563eb;
        }

        .btn:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏪ Reverse Video Studio</h1>

        <div class="video-container">
            <!-- Live Preview Video -->
            <video id="webcam" autoplay playsinline muted></video>

            <!-- Reversed Video Output Canvas -->
            <canvas id="canvas" class="hidden"></canvas>

            <!-- Recording Indicator -->
            <div id="recordingBadge" class="recording-badge hidden">
                <div class="dot"></div> Recording...
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-secondary">Enable Camera</button>
            <button id="switchBtn" class="btn btn-secondary hidden">🔄 Switch Camera</button>
            <button id="recordBtn" class="btn btn-primary hidden">Start Recording</button>
            <button id="stopBtn" class="btn btn-stop hidden">Stop & Reverse</button>
            <button id="resetBtn" class="btn btn-secondary hidden">Record Again</button>
        </div>
    </div>

    <script>
        const webcam = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const recordingBadge = document.getElementById('recordingBadge');

        let mediaStream = null;
        let frames = [];
        let captureInterval = null;
        let animationFrameId = null;
        let currentFacingMode = 'environment'; // Defaults to back camera

        // Initialize Camera Stream
        async function initCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 }, 
                        facingMode: currentFacingMode 
                    },
                    audio: false 
                });
                webcam.srcObject = mediaStream;
                return true;
            } catch (err) {
                alert('Camera access error: ' + err.message);
                return false;
            }
        }

        startBtn.addEventListener('click', async () => {
            const success = await initCamera();
            if (success) {
                startBtn.classList.add('hidden');
                recordBtn.classList.remove('hidden');
                switchBtn.classList.remove('hidden');
            }
        });

        switchBtn.addEventListener('click', async () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            await initCamera();
        });

        // Start real-time frame capturing
        recordBtn.addEventListener('click', () => {
            // Clean up previous frame buffer
            frames.forEach(frame => frame.close && frame.close());
            frames = [];

            recordingBadge.classList.remove('hidden');
            recordBtn.classList.add('hidden');
            switchBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');

            canvas.width = webcam.videoWidth || 640;
            canvas.height = webcam.videoHeight || 480;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Capture frames directly from webcam feed every 33ms (~30 FPS)
            captureInterval = setInterval(async () => {
                tempCtx.drawImage(webcam, 0, 0, tempCanvas.width, tempCanvas.height);
                const bitmap = await createImageBitmap(tempCanvas);
                frames.push(bitmap);
            }, 1000 / 30);
        });

        // Stop recording and trigger immediate reverse playback
        stopBtn.addEventListener('click', () => {
            clearInterval(captureInterval);
            recordingBadge.classList.add('hidden');
            stopBtn.classList.add('hidden');

            if (frames.length === 0) return;

            // Reverse the collected frames array directly
            frames.reverse();

            // Display reversed canvas playback
            webcam.classList.add('hidden');
            canvas.classList.remove('hidden');
            resetBtn.classList.remove('hidden');

            playReversedLoop();
        });

        // Canvas animation playback loop
        let frameIndex = 0;
        let lastTimestamp = 0;
        const frameInterval = 1000 / 30; // 30 FPS

        function playReversedLoop(timestamp = 0) {
            animationFrameId = requestAnimationFrame(playReversedLoop);

            const elapsed = timestamp - lastTimestamp;
            if (elapsed > frameInterval) {
                lastTimestamp = timestamp - (elapsed % frameInterval);

                if (frames.length > 0) {
                    ctx.drawImage(frames[frameIndex], 0, 0, canvas.width, canvas.height);
                    frameIndex = (frameIndex + 1) % frames.length;
                }
            }
        }

        // Reset UI state for next recording
        resetBtn.addEventListener('click', () => {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            // Free GPU/RAM frame memory
            frames.forEach(frame => frame.close && frame.close());
            frames = [];
            frameIndex = 0;

            canvas.classList.add('hidden');
            webcam.classList.remove('hidden');
            resetBtn.classList.add('hidden');
            recordBtn.classList.remove('hidden');
            switchBtn.classList.remove('hidden');
        });
    </script>
</body>
</html>
